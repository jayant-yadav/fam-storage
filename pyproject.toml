[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fam-storage"
version = "0.1.0"
description = "Extract and store pictures of loved ones from cloud sources to a local Nextcloud NAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Cloud connectors
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "requests>=2.32.0",
    "pyicloud>=1.0.0",

    # Face detection / recognition (CPU-optimised dlib backend)
    "face-recognition>=1.3.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",

    # Nextcloud / WebDAV storage
    "webdavclient3>=3.14.6",

    # Configuration & CLI
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.3",
    "freezegun>=1.5.1",
]

[project.scripts]
fam-storage = "fam_storage.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
